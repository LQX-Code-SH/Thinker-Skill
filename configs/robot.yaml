# 机型选择与全局参数
model: tienkung_dex       # 选择 robots/<model>
backend: real             # real | sim | mock（部署实机用 real，开发机可用 mock）

# 手部变体：brainco(强脑 6 DOF) | inspire(因时 13 关节) | fixed(拳头假手，无夹爪)
hand_variant: brainco
hand_side: right

# 头部相机正运动学 URDF；留空则用包内 resources/urdf/tienkung_dex_brainco.urdf
urdf_path: null

# pelvis 距地面高度（站立/半身运控），用于 pelvis → base(地面) 平移；待实测标定
pelvis_height: 0.92

# 头部相机内参（自标定 2026-09-29，rational 8 参）
camera:
  name: head_gemini336
  width: 1280
  height: 720
  k: [694.64125721, 0.0, 640.01981966, 0.0, 694.60720736, 363.57411502, 0.0, 0.0, 1.0]
  distortion_model: rational
  d: [-3.34663455, 4.14604418, 0.00053256, -0.00079030, -1.52466885, -3.34589408, 4.14748612, -1.52468165]

# 技能私有配置（经 ctx.cfg 注入，可按技能覆盖）
skills:
  look_down_table:
    # 真机头部低头稳态上限约 47.5°（SDK 表写 58°，实测 50/58 目标均停在 0.829 rad）
    max_pitch_deg: 47.5
    tol_deg: 1.0
    settle_ticks: 3
  detect_object:
    # 相对路径：部署包内解析到 <ver>/weights/...，源码树回退到仓库根
    model_path: weights/grounding-dino-tiny

tick_rate: 10             # 动作循环频率（Hz）
default_timeout: 300      # 缺省超时（秒，Action 通道兜底）

# MCP 聚合端口（对外只暴露这一个；每技能独立端口 8022+ 仅平台注册用）
mcp:
  enabled: true
  name: thinker_skills
  host: localhost         # 对外暴露需改 0.0.0.0 并前置反代/白名单
  port: 8010              # 本机 8000 被 interaction_orc 占用，改用 8010

# 臂 IK（robots/tienkung_dex/ik.py）
ik:
  solver: daqp            # daqp（QP+限位）| dls（无约束）
  tol: 1e-3               # 收敛阈值（米）
  max_iter: 30
  damping: 0.08
