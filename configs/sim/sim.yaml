# robot_sim / MuJoCo 仿真覆盖项
model: tienkung_dex
backend: robosim
hand_variant: inspire       # robot_sim 模型默认注入因时 13 维手
hand_side: right

# 相机内参取 /ob_camera_head/color/camera_info（640x480），不用 ../robot.yaml 的真机 K
camera:
  name: ob_camera_head

skills:
  look_down_table:
    # 仿真 head pitch 上限 +0.2618 rad ≈ 15°；相机再向下 25°，视线可到约 40°
    max_pitch_deg: 47.5
    tol_deg: 1.0
    settle_ticks: 3
  detect_object:
    model_path: weights/grounding-dino-tiny
    segment:
      backend: sam2
      model_path: weights/sam2-hiera-tiny
    # 分层定位：base（默认）| plane（可选增强）
    #   base  : 掩码/框质心 + 固定补偿，不依赖点云，最快
    #   plane : 掩码反投影成点云（去 NaN/桌面/离群），沿桌面法向定 z，
    #           横向用投影中位数 + offset_xy 标定；不输出轴向与 3D 框
    locate:
      # 定位分级（按任务精度需求，技能调用可用 level 参数覆盖）
      #   1 场景级：只求目标在哪，允许厘米偏差（掩码质心 + offset）
      #   2 抓取级：一般抓取，点云 + 平面约束定 z（实测 z 误差 ±3 mm）
      #   3 精细级：精细操作，需 6D（FoundationPose）；未就绪自动降级为 2
      level: 2
      offset: 0.03          # L1：沿视线补偿（米）
      plane_z: 0.92         # L2：台面高度（base 系）
      offset_xy: [0.0, 0.0] # L2：通用横向标定（未按类别配置时使用）
      # 按类别的横向标定（米）：单视角只看半面带来的残差，按实测填；
      # 未列出的类别自动回退到上面的通用值（默认 0，即不做任何补偿）。
      # 注意：标定值与视角相关（当前为低头 45°、base x≈0.44~0.60 标定）。
      objects:
        apple:          {offset_xy: [-0.001, -0.003]}
        cup:            {offset_xy: [-0.006, -0.008]}
        "water bottle": {offset_xy: [0.018, 0.010]}
        bottle:         {offset_xy: [0.018, 0.010]}
        # 香蕉：用视觉重心（mask 质心直投），不做几何补偿。
        # 它的 body 原点落在弯弧凹侧的空腔里（射线法判定在实体外），
        # 任何"几何中心"补偿都会把 obj_pose 推到可见区域之外。
        banana:         {offset_xy: [0.0, 0.0]}
    # 6D 精定位（可选）：需 CAD 资产 + 许可证评估，默认关闭
    pose6d:
      backend: none         # none | foundationpose
  fetch_object:
    # 示教位姿（configs/robot.yaml: taught_poses）是真机采的，仿真 URDF 下
    # pregrasp/grasp 两个 TCP 点 IK 无解（差 58–81 mm，受腕部姿态约束），
    # 所以仿真强制走 plan_grasp 重新规划。
    use_taught: false
    # 抓取姿态绕竖轴再转 -30°：岛台高度（z≈0.97）下默认 (0,-90,0) 无解，
    # 苹果是回转体，偏航不影响抓取。
    base_orientation_deg: [0.0, -90.0, -30.0]
    # 到位判据：仿真 PD 稳态误差大于真机，1 cm 门限会一直"差一点"导致超时
    approach_tol: 0.02
    # 抓取点位（z_bias / tcp_delta_* / grasp_delta_* / grasp_positions）仍是
    # 真机标定值，仿真下实测偏高、会把物体推开，尚未标定完，暂不在此覆盖。
    # 已知边界：俯抓姿态在 z≈0.97 以下是 IK 臂展下限。
