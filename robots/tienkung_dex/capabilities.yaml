# 天工 DEX（tienkung_dex）能力契约
# 供装配期与技能 requires 做子集匹配（D-015）
robot_model: tienkung_dex
version: "3.0"
sdk: "tienkung_dex>=1.0"

# 基础能力：所有手部配置共有
capabilities:
  body.arm:
    dof: 7            # 单臂 7 轴（ID 11-17 左 / 21-27 右）
    pose_ik: true     # 位姿 IK（QP + DAQP，见 D-017）
    ik_solver: daqp
  body.waist:
    dof: 3            # pitch / roll / yaw
    height: false     # 无升降自由度
  body.head:
    dof: 2            # yaw / pitch
  body.base:
    mode: velocity    # 速度流 20Hz，无到位反馈
    pose: false
  sensor.rgbd:
    count: 4          # head / waist / wrist_left / wrist_right
    depth_unit: mm
    color_format: bgr8
  sensor.audio_in: {}
  sensor.audio_out: {}
  sensor.imu:
    source: livox
  sensor.pointcloud: {}

# 手部变体：装配期按 configs/robot.yaml 的 hand_variant 选一个合并进 capabilities
# 拳头假手不启用 hand 子系统，因此没有 body.gripper 能力
hand_variants:
  brainco:
    hand_vendor: brainco
    enable_hand: true
    capabilities:
      body.gripper:
        type: brainco     # 6 电机灵巧手
        dof: 6
  inspire:
    hand_vendor: inspire
    enable_hand: true
    capabilities:
      body.gripper:
        type: inspire     # 13 关节灵巧手
        dof: 13
  fixed:
    hand_vendor: none
    enable_hand: false
    capabilities: {}      # 拳头假手：无 body.gripper
