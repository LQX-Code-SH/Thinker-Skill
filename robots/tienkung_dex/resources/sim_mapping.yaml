# robosim 后端参数（话题、增益、头部符号、手 id）
# 改这里不用重编：host 启动时读取
topics:
  arm: /arm
  waist: /waist
  head: /head
  camera: /ob_camera_head
  hand:
    left: /left_hand
    right: /right_hand

gains:
  arm: {kp: 100.0, kd: 7.4}
  waist: {kp: 120.0, kd: 8.0}
  head: {kp: 40.0, kd: 2.0}

# 头部符号/限位：真机与 MJCF 都是低头为正（+），不需要翻符号。
## 与真机 SDK 限位一致：head_pitch [-15°, +58°]（正值=低头）；
## 相机安装角也已对齐真机（光轴水平，无固有俯角）。
head:
  yaw_sign: 1.0
  pitch_sign: 1.0
  pitch_offset: 0.0
  yaw_limits: [-1.0472, 1.0472]
  pitch_limits: [-0.2618, 1.0123]

hand:
  inspire:
    hand_id: {left: 1, right: 2}
