# play_action 内置动作清单（随技能包发布，运行期每次调用现读）
# 没有本文件时技能回退到"按文件名/路径搜索"，行为与旧版本一致。
# 约定：一个动作一个文件（每个 json 只保留一个 clip，activeClipId 指向它）；
# 新增动作 = 新增 json + 在下面加一条，不改其它动作文件。
version: 1
actions:
  goready:
    file: goready.json
    clip: goready
    display_name: 就绪
    aliases: [ready, 准备]
    tags: [ready, greeting]
    models: [tienkung_dex]
    hand_variants: [inspire, brainco, fixed]
    hand_mode: auto
    defaults: {speed: 1.0, transition_s: 2.0}
    requires: [body.arm.left, body.arm.right, body.waist, body.head]
    verified: {env: real, date: 2026-11-18}

  gohome:
    file: gohome.json
    clip: gohome
    display_name: 回零
    aliases: [home, 回零位]
    tags: [home]
    models: [tienkung_dex]
    hand_variants: [inspire, brainco, fixed]
    hand_mode: auto
    defaults: {speed: 1.0, transition_s: 2.0}
    requires: [body.arm.left, body.arm.right, body.waist, body.head]
    verified: {env: real, date: 2026-11-18}
