name: play_action
version: 0.1.0
category: motion
min_core: 0.1.0
entry: play_action.plugin:PlayAction
commands: [play_action]
# 只驱动上半身：腿由运控持有（SDK 禁止关节级下发），文件里的腿轨迹忽略
requires: [body.arm.left, body.arm.right, body.waist, body.head]
precondition: []
postcondition: {}
timeout: 300
interfaces: [service, action]
errors:
  - INPUT_INVALID_PARAMS
  - PRECOND_BODY_BUSY
  - PRECOND_CAPABILITY_MISSING
  - SYS_TIMEOUT
mcp: {tools: [play_action], port: 8034}
